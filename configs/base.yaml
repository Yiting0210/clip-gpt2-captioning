# Shared defaults. Experiment files say `base: base.yaml` and override what differs.
experiment: base
clip_model: openai/clip-vit-base-patch32
gpt2_model: gpt2
injection: prefix          # prefix | cross_attention
finetune: prefix           # prefix (GPT-2 frozen) | lora | full
prefix_length: 10
max_caption_tokens: 40
data_dir: data/processed
output_root: runs
train_images: null         # null = all 4,000 training images; e.g. 1000 for the data-size experiment

lora:
  r: 8
  alpha: 16
  dropout: 0.05

train:
  epochs: 40               # round 1 used 10: every run was still improving when it ended
  batch_size: 32
  lr: 1.0e-4               # new weights: mapping network, cross-attention layers, LoRA adapters
  gpt_lr: null             # pretrained GPT-2 weights (full fine-tuning); null = same as lr
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  early_stopping_patience: 3
  seed: 42
  num_workers: 0           # features live in memory; workers are not needed
  log_every: 20
  overfit_lr: 1.0e-3

eval:
  num_preview: 5           # fixed val images captioned after every epoch
  strategy: beam_w3
